<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הזמנות פריטים — חנות יודאייקה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --bg:#f7f1f1; --surface:#ffffff; --surface-2:#f0eee7;
    --text:#211f1a; --text-muted:#6b6558; --border:#e2ddd0;
    --accent:#7a2e3a; --accent-2:#62242e; --accent-soft:#f3e5e7;
    --danger:#b3432f; --danger-soft:#fbeae6; --ok:#2f6b35; --ok-soft:#e9f3ea;
    --warn:#9a5b12; --warn-soft:#fdf0dc; --scan:#5b3d8f;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1a1516; --surface:#1d2025; --surface-2:#242830;
      --text:#eae7df; --text-muted:#9b968a; --border:#33363d;
      --accent:#e29aa5; --accent-2:#ecb4bc; --accent-soft:#33212a;
      --danger:#e08a73; --danger-soft:#3a211c; --ok:#7fce89; --ok-soft:#17291b;
      --warn:#e7b26b; --warn-soft:#3a2c17; --scan:#b49be0;
    }
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Heebo',-apple-system,'Segoe UI',sans-serif;padding:20px 16px 60px;}
  .wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:16px;}
  h1{font-size:22px;margin:0;}
  .top-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media (max-width:480px){.grid2{grid-template-columns:1fr;}}
  label{font-size:12.5px;color:var(--text-muted);display:block;margin-bottom:4px;}
  input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);font-family:inherit;font-size:14.5px;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}
  input.invalid{border-color:var(--danger);background:var(--danger-soft);}
  button{cursor:pointer;border:none;border-radius:9px;font-family:inherit;font-weight:600;font-size:14px;padding:10px 16px;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);}
  .btn-small{padding:6px 10px;font-size:12.5px;}
  .btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger);padding:6px 10px;font-size:12.5px;}
  .btn-ok{background:var(--ok);color:#fff;}
  .btn-add{background:var(--accent-soft);color:var(--accent);width:100%;}
  .link-out{font-size:13px;color:var(--accent);text-decoration:none;border:1px solid var(--border);border-radius:9px;padding:7px 11px;background:var(--surface);font-weight:600;}
  .tabs{display:flex;gap:8px;}
  .tab{flex:1;text-align:center;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;}
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .hidden{display:none !important;}
  .msg{border-radius:11px;padding:12px 14px;font-size:14px;line-height:1.6;display:none;}
  .msg.ok{display:block;background:var(--ok-soft);color:var(--ok);}
  .msg.err{display:block;background:var(--danger-soft);color:var(--danger);}
  .sub{color:var(--text-muted);font-size:13px;}
  .search-wrap{position:relative;}
  .search-wrap input{padding-left:38px;}
  .search-wrap button{position:absolute;left:6px;top:50%;transform:translateY(-50%);width:28px;height:28px;padding:0;border-radius:50%;background:var(--surface-2);color:var(--text-muted);font-size:13px;}
  .filters{display:grid;grid-template-columns:2fr 1fr;gap:8px;}
  .order-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;}
  .order-card:hover{border-color:var(--accent);}
  .order-card.overdue{border-right:5px solid var(--danger);}
  .order-card.soon{border-right:5px solid var(--warn);}
  .oc-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;}
  .oc-head b{font-size:15px;}
  .chips{display:flex;flex-wrap:wrap;gap:5px;}
  .chip{font-size:12px;border-radius:7px;padding:2px 8px;background:var(--surface-2);color:var(--text-muted);font-weight:600;}
  .chip.ready{background:var(--ok-soft);color:var(--ok);}
  .chip.final{background:var(--accent-soft);color:var(--accent);}
  .due{font-size:12.5px;font-weight:700;border-radius:7px;padding:3px 8px;white-space:nowrap;}
  .due.overdue{background:var(--danger-soft);color:var(--danger);}
  .due.soon{background:var(--warn-soft);color:var(--warn);}
  .due.later{background:var(--surface-2);color:var(--text-muted);}
  .badge-ready{background:var(--ok);color:#fff;font-size:12px;font-weight:700;border-radius:7px;padding:2px 8px;}
  .line{border:1px solid var(--border);border-radius:11px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2);}
  .line-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
  .line-grid{display:grid;grid-template-columns:1fr 1.6fr;gap:8px;}
  .line-grid .desc{grid-column:1 / -1;}
  @media (max-width:480px){.line-grid{grid-template-columns:1fr;}}
  .line select.status{font-weight:700;}
  .events{display:flex;flex-direction:column;gap:4px;font-size:12.5px;max-height:260px;overflow-y:auto;}
  .events div{background:var(--surface-2);border-radius:7px;padding:5px 9px;}
  /* סריקה מהירה */
  body.scan-on{--bg:#ece6f6;}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) body.scan-on{--bg:#211a2e;} }
  #scanPanel{border:2px solid var(--scan);}
  .status-pick{display:flex;flex-wrap:wrap;gap:6px;}
  .status-pick button{background:var(--surface-2);color:var(--text);border:1px solid var(--border);padding:8px 12px;font-size:13.5px;}
  .status-pick button.active{background:var(--scan);color:#fff;border-color:var(--scan);}
  .toggle{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;cursor:pointer;user-select:none;}
  .toggle input{width:20px;height:20px;}
  #scanInput{font-size:18px;text-align:center;letter-spacing:1px;}
  .log{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto;}
  .entry{border-radius:9px;padding:8px 11px;font-size:13px;}
  .entry.ok{background:var(--ok-soft);color:var(--ok);}
  .entry.warn{background:var(--danger-soft);color:var(--danger);}
  .entry .d{font-size:12px;opacity:.85;margin-top:2px;}
  #cameraReader{width:100%;max-width:420px;margin:0 auto;border-radius:10px;overflow:hidden;}
  #scanFlash{position:fixed;top:0;left:0;right:0;z-index:90;padding:10px 14px;text-align:center;font-weight:800;font-size:15px;color:#fff;transform:translateY(-110%);transition:transform .2s;}
  #scanFlash.show{transform:none;}
  #scanFlash.ok{background:var(--ok);}
  #scanFlash.warn{background:var(--danger);}
  .modal-back{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;}
  .modal-card{width:100%;max-width:500px;max-height:90vh;overflow-y:auto;}
  .pick-list{display:flex;flex-direction:column;gap:6px;}
  .pick-list label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--text);margin:0;background:var(--surface-2);border-radius:8px;padding:8px 10px;cursor:pointer;}
  .pick-list input{width:18px;height:18px;flex-shrink:0;}
  .mini-lines{font-size:12.5px;display:flex;flex-direction:column;gap:3px;}
  .mini-lines div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--border);padding:3px 0;}
  .mini-lines div.me{font-weight:800;}
  .pay-box{border:1px solid var(--border);border-radius:11px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2);}
  .pay-form{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;}
  @media (max-width:480px){.pay-form{grid-template-columns:1fr 1fr;} .pay-form button{grid-column:1 / -1;}}
  .pay-row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;background:var(--surface);border-radius:8px;padding:6px 10px;}
  .chip.due{background:var(--danger-soft);color:var(--danger);}
  .type-field{display:flex;flex-direction:column;gap:6px;}
  .check-btn{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn);font-weight:800;font-size:13.5px;text-align:center;}
  .check-btn.on{background:var(--warn);color:#fff;}
  .dirty-bar{position:sticky;bottom:8px;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:10px;background:#f6c343;color:#3d2c00;border-radius:11px;padding:10px 12px;font-weight:800;font-size:14px;box-shadow:0 3px 12px rgba(0,0,0,.25);}
  .dirty-bar button{background:#3d2c00;color:#fff;padding:8px 12px;font-size:13px;white-space:nowrap;}
  .tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
  .heb-hint{font-size:12px;color:var(--text-muted);margin-top:3px;min-height:15px;}
  .tiles.st{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));}
  .tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px;text-align:center;cursor:pointer;}
  .tile:hover{border-color:var(--accent);}
  .tile .n{font-size:24px;font-weight:800;color:var(--accent);line-height:1.1;}
  .tile .l{font-size:12.5px;font-weight:700;margin-top:3px;}
  .tile .m{font-size:11.5px;color:var(--text-muted);}
  .tile.ok .n{color:var(--ok);} .tile.warn .n{color:var(--danger);font-size:19px;}
  .card.dash .tile{background:var(--surface-2);}
  .matrix{border-collapse:collapse;font-size:12.5px;width:100%;}
  .matrix th,.matrix td{border-bottom:1px solid var(--border);padding:5px 7px;text-align:center;white-space:nowrap;}
  .matrix th:first-child,.matrix td:first-child{text-align:right;}
  .matrix th{color:var(--text-muted);font-weight:600;font-size:11.5px;}
  .dash-list{display:flex;flex-direction:column;gap:5px;}
  .dash-row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--surface-2);border-radius:9px;padding:8px 10px;cursor:pointer;font-size:13.5px;flex-wrap:wrap;}
  .dash-row:hover{outline:1px solid var(--accent);}
  /* ניהול רשימות (מוצג גם בדף הניהול של החנות) */
  .admin-list{display:flex;flex-direction:column;gap:6px;}
  .admin-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .site-strip{margin:-20px -16px 14px;padding:7px 16px;background:var(--accent);color:#fff;font-weight:800;font-size:13.5px;letter-spacing:.2px;text-align:center;}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .site-strip{color:#111;} }
</style>
</head>
<body>
<div class="site-strip">🧾 הזמנות פריטים</div>
<div id="scanFlash"></div>
<div id="modal" class="modal-back hidden"><div class="card modal-card" id="modalBody"></div></div>
<div class="wrap">
  <div class="top-bar">
    <h1>🧾 הזמנות פריטים</h1>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button type="button" class="link-out" id="scanToggle" style="cursor:pointer;font-family:inherit;">⚡ סריקה מהירה</button>
      <a class="link-out" href="/orders.html">↩ הזמנות סת"ם</a>
    </div>
  </div>

  <!-- סריקה מהירה: בוחרים מצב יעד, וכל סריקה מעדכנת את הפריט (או את כל ההזמנה) למצב הזה -->
  <div id="scanPanel" class="card hidden">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
      <b>⚡ סריקה מהירה</b>
      <button type="button" class="btn-ghost btn-small" id="scanClose">יציאה</button>
    </div>
    <div class="sub" style="margin:0;">סורקים מדבקת פריט (או מקלידים מספר הזמנה) — ואז בוחרים אם לעדכן רק את הפריט או את כל ההזמנה, ולאיזה מצב.</div>
    <input id="scanInput" placeholder="סרוק ברקוד…" inputmode="numeric" autocomplete="off">
    <div style="display:flex;gap:8px;">
      <button type="button" class="btn-ghost btn-small" id="cameraBtn">📷 מצלמה</button>
    </div>
    <div id="cameraReader" class="hidden"></div>
    <div class="log" id="scanLog"></div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="active">פעילות</div>
    <div class="tab" data-tab="all">כל ההזמנות</div>
    <div class="tab" data-tab="new">+ הזמנה חדשה</div>
  </div>

  <!-- פעילות: דשבורד -->
  <div id="dashPanel" style="display:flex;flex-direction:column;gap:12px;"></div>

  <!-- רשימה -->
  <div id="listPanel" class="hidden" style="display:flex;flex-direction:column;gap:10px;">
    <div class="filters">
      <div class="search-wrap"><input id="search" placeholder="חיפוש לפי שם / טלפון / מספר הזמנה / פריט…" autocomplete="off"><button type="button" id="searchClear" class="hidden" aria-label="נקה חיפוש">✕</button></div>
      <select id="statusFilter"><option value="">כל המצבים</option></select>
    </div>
    <button type="button" class="check-btn hidden" id="checkDueBtn"></button>
    <div class="sub" id="listCount"></div>
    <div id="ordersList" style="display:flex;flex-direction:column;gap:8px;"></div>
  </div>

  <!-- הזמנה חדשה -->
  <form id="newPanel" class="card hidden" autocomplete="off">
    <div class="grid2">
      <div><label>שם פרטי</label><input id="nFirst" placeholder="פרטי או משפחה — אחד מהם חובה"></div>
      <div><label>שם משפחה</label><input id="nLast" placeholder="פרטי או משפחה — אחד מהם חובה"></div>
    </div>
    <div class="grid2">
      <div><label>טלפון</label><input id="nPhone" type="tel" inputmode="numeric"></div>
      <div><label>תאריך יעד — עד מתי הכל אמור להיות מוכן</label><input id="nTarget" type="date"><div class="heb-hint" data-for="nTarget"></div></div>
    </div>
    <div><label>🔔 תאריך לבדיקה — מתי לבדוק מה מצב ההזמנה</label><input id="nCheck" type="date"><div class="heb-hint" data-for="nCheck"></div></div>
    <div class="sub hidden" id="nSuggest"></div>
    <div><label>הערות</label><input id="nNotes" placeholder="לא חובה"></div>
    <div class="grid2">
      <div><label>💰 סכום לתשלום — כמה הלקוח אמור לשלם (₪) *</label><input id="nPrice" type="number" min="0" step="0.01" inputmode="decimal" placeholder="חובה"></div>
      <div><label>💵 שולם בפועל עכשיו (₪)</label><input id="nPaid" type="number" min="0" step="0.01" inputmode="decimal" placeholder="לא חובה"></div>
    </div>
    <div id="nLines" style="display:flex;flex-direction:column;gap:8px;"></div>
    <button type="button" class="btn-add" id="nAddLine">+ הוסף פריט</button>
    <div style="display:flex;justify-content:flex-end;"><button type="submit" class="btn-primary">צור הזמנה</button></div>
    <div class="msg" id="nMsg"></div>
  </form>

  <!-- הזמנה -->
  <div id="detailPanel" class="card hidden">
    <div class="top-bar">
      <b id="dTitle"></b>
      <button type="button" class="btn-ghost btn-small" id="dBack">← חזרה לרשימה</button>
    </div>
    <div class="grid2">
      <div><label>שם פרטי</label><input id="dFirst"></div>
      <div><label>שם משפחה</label><input id="dLast"></div>
    </div>
    <div class="grid2">
      <div><label>טלפון</label><input id="dPhone" type="tel" inputmode="numeric"></div>
      <div><label>תאריך יעד</label><input id="dTarget" type="date"><div class="heb-hint" data-for="dTarget"></div></div>
    </div>
    <div class="grid2">
      <div><label>הערות</label><input id="dNotes"></div>
      <div><label>🔔 תאריך לבדיקה</label><input id="dCheck" type="date"><div class="heb-hint" data-for="dCheck"></div></div>
    </div>
    <div class="pay-box">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;"><b>💰 תשלום</b><span id="dBalance" style="font-weight:700;"></span></div>
      <div><label>סכום לתשלום (₪) * — נשמר ב"שמור פרטים"</label><input id="dPrice" type="number" min="0" step="0.01" inputmode="decimal" placeholder="חובה"></div>
      <div id="dPayments" style="display:flex;flex-direction:column;gap:5px;"></div>
      <div class="pay-form"><input id="dPayAmount" type="number" min="0" step="0.01" inputmode="decimal" placeholder="שולם ₪"><input id="dPayNote" placeholder="הערה (לא חובה)"><button type="button" class="btn-primary" id="dPayAdd">הוסף תשלום</button></div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button type="button" class="btn-primary" id="dSave">שמור פרטים</button>
      <button type="button" class="btn-ok" id="dSupplyAll">✓ סמן את כל ההזמנה כסופקה</button>
      <button type="button" class="btn-ghost" id="dLabels">🏷️ מדבקות</button>
      <button type="button" class="btn-ghost" id="dPrintA4">🖨️ הדפסת A4</button>
    </div>
    <div class="msg" id="dMsg"></div>
    <div id="dDirtyBar" class="dirty-bar hidden">⚠️ יש שינויים שממתינים לשמירה <button type="button" id="dDirtySave">שמור פרטים</button></div>
    <b style="font-size:14px;">פריטים</b>
    <div id="dLines" style="display:flex;flex-direction:column;gap:8px;"></div>
    <details>
      <summary style="cursor:pointer;font-weight:600;color:var(--accent);">+ הוסף פריט להזמנה</summary>
      <div id="dAddLine" style="display:flex;flex-direction:column;gap:8px;margin-top:8px;"></div>
      <button type="button" class="btn-add" id="dAddLineBtn" style="margin-top:8px;">הוסף פריט</button>
    </details>
    <details>
      <summary style="cursor:pointer;font-weight:600;color:var(--accent);">🕘 היסטוריה</summary>
      <div class="events" id="dEvents" style="margin-top:8px;"></div>
    </details>
    <div style="display:flex;justify-content:flex-end;"><button type="button" class="btn-danger" id="dDelete">מחק הזמנה</button></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
let META = { product_types: [], statuses: [] };
let currentTab = 'active';
let openOrder = null;

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fullName(c){ return [c.first_name, c.last_name].filter(Boolean).join(' '); }
async function api(path, opts){
  const res = await fetch('/api/items' + path, opts && opts.body ? { ...opts, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(opts.body) } : opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'שגיאה');
  return data;
}
const ils = (n) => '₪' + Number(n || 0).toLocaleString('he-IL', { maximumFractionDigits: 2 });
// "לתשלום X · שולם Y · נשאר Z" / ✓ שולם במלואו. price=null — רק כמה שולם
function balanceInfo(price, paid){
  if (price == null) return paid > 0 ? { text: 'שולם ' + ils(paid), due: false } : null;
  const left = Math.round((price - paid) * 100) / 100;
  if (left <= 0) return { text: '✓ שולם במלואו' + (left < 0 ? ' (עודף ' + ils(-left) + ')' : ''), due: false };
  return { text: 'לתשלום ' + ils(price) + ' · שולם ' + ils(paid) + ' · נשאר ' + ils(left), due: true, left };
}
const lineText = (l) => [l.product_type, l.item_name].filter(Boolean).join(' — ');
// חלון בחירה כללי: html + כפתורים; מחזיר את האלמנט כדי לחבר אירועים
function openModal(html){
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modal').classList.remove('hidden');
  return document.getElementById('modalBody');

// --- תאריך עברי (באותיות, כמו בדף החנות): "י״ז חשוון תשפ״ז" ---
function gematria(n){
  n = n % 1000;
  let out = '';
  for (const [v, ch] of [[400, 'ת'], [300, 'ש'], [200, 'ר'], [100, 'ק']]) while (n >= v) { out += ch; n -= v; }
  if (n === 15) out += 'טו'; else if (n === 16) out += 'טז';
  else {
    const tens = ['', 'י', 'כ', 'ל', 'מ', 'נ', 'ס', 'ע', 'פ', 'צ'], units = ['', 'א', 'ב', 'ג', 'ד', 'ה', 'ו', 'ז', 'ח', 'ט'];
    out += tens[Math.floor(n / 10)] + units[n % 10];
  }
  return out.length > 1 ? out.slice(0, -1) + '״' + out.slice(-1) : out + '׳';
}
const hebFmt = new Intl.DateTimeFormat('he-u-ca-hebrew', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'Asia/Jerusalem' });
// d: 'YYYY-MM-DD' או Date / מחרוזת זמן
function hebDate(d){
  if (!d) return '';
  try {
    const date = typeof d === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(d) ? new Date(d + 'T12:00:00+03:00') : new Date(d);
    const parts = hebFmt.formatToParts(date);
    const get = (t) => parts.find(x => x.type === t)?.value || '';
    return gematria(+get('day')) + ' ' + get('month') + ' ' + gematria(+get('year'));
  } catch (e) { return ''; }
}
// מתחת לכל שדה תאריך — התאריך העברי
function syncHebHints(){ document.querySelectorAll('.heb-hint').forEach(h => { h.textContent = hebDate(document.getElementById(h.dataset.for).value); }); }

// תאריך לתצוגה: עברי + לועזי
function fmtDate(d){ return d ? hebDate(d) + ' (' + d.split('-').reverse().join('.') + ')' : ''; }
function fmtDay(ts){ return ts ? hebDate(ts) + ' (' + new Date(ts).toLocaleDateString('he-IL') + ')' : ''; }
// טלפון — אותו נרמול/בדיקה כמו בשרת (lib/phone.js)
function normalizePhone(v){
  let d = String(v || '').replace(/\D/g, '');
  if (d.startsWith('972')) d = '0' + d.slice(3);
  else if (/^[5-9]\d{8}$/.test(d) || /^[2-4]\d{7}$/.test(d)) d = '0' + d;
  return d;
}
function isValidPhone(d){ return /^0[57]\d{8}$/.test(d) || /^0[23489]\d{7}$/.test(d); }
function checkPhone(el, msgEl){
  el.value = normalizePhone(el.value);
  const ok = isValidPhone(el.value);
  el.classList.toggle('invalid', !ok);
  if (!ok) { msgEl.className = 'msg err'; msgEl.textContent = 'מספר טלפון לא תקין — נייד: 10 ספרות שמתחילות ב-05 (או 07), קווי: 9 ספרות.'; el.focus(); }
  return ok;
}
['nPhone', 'dPhone'].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('blur', () => { if (!el.value.trim()) return; el.value = normalizePhone(el.value); el.classList.toggle('invalid', !isValidPhone(el.value)); });
  el.addEventListener('input', () => el.classList.remove('invalid'));
});

// דחיפות לפי תאריך יעד: באיחור (אדום) / עד 3 ימים (כתום) / רחוק
function dueInfo(o){
  if (!o.target_date) return { cls: '', html: '' };
  const d = o.days_left;
  if (o.supplied_at) return { cls: '', html: '<span class="due later">יעד ' + fmtDate(o.target_date) + '</span>' };
  if (d < 0) return { cls: 'overdue', html: '<span class="due overdue">באיחור ' + (-d) + ' ימים · ' + fmtDate(o.target_date) + '</span>' };
  if (d === 0) return { cls: 'overdue', html: '<span class="due overdue">להיום! · ' + fmtDate(o.target_date) + '</span>' };
  if (d <= 3) return { cls: 'soon', html: '<span class="due soon">בעוד ' + d + (d === 1 ? ' יום' : ' ימים') + ' · ' + fmtDate(o.target_date) + '</span>' };
  return { cls: '', html: '<span class="due later">יעד ' + fmtDate(o.target_date) + '</span>' };
}

async function loadList(){
  const list = document.getElementById('ordersList');
  const count = document.getElementById('listCount');
  count.textContent = 'טוען…';
  const params = new URLSearchParams({ state: 'all' });
  if (checkDueOnly) params.set('check_due', '1');
  const q = document.getElementById('search').value.trim();
  if (q) params.set('q', q);
  if (document.getElementById('statusFilter').value) params.set('status_id', document.getElementById('statusFilter').value);
  try {
    const { orders, check_due_count } = await api('/orders?' + params);
    const cb = document.getElementById('checkDueBtn');
    cb.classList.toggle('hidden', !check_due_count && !checkDueOnly);
    cb.classList.toggle('on', checkDueOnly);
    cb.textContent = checkDueOnly ? '🔔 מוצגות רק הזמנות לבדיקה — לחץ להצגת הכל' : '🔔 ' + check_due_count + ' הזמנות שהגיע הזמן לבדוק מה מצבן — לחץ להצגה';
    count.textContent = orders.length + ' הזמנות · הפתוחות קודם, לפי תאריך יעד; אחריהן אלה שסופקו';
    list.innerHTML = orders.map(o => {
      const due = dueInfo(o);
      // סיכום מצבים: כמה פריטים בכל מצב
      const counts = new Map();
      o.lines.forEach(l => { const k = l.status_id; counts.set(k, { n: (counts.get(k)?.n || 0) + 1, l }); });
      const chips = [...counts.values()].map(({ n, l }) => '<span class="chip' + (l.is_final ? ' final' : l.is_ready ? ' ready' : '') + '">' + esc(l.status) + (n > 1 ? ' ×' + n : '') + '</span>').join('');
      const allReady = o.lines.length && !o.supplied_at && o.lines.every(l => l.is_ready || l.is_final);
      const bal = balanceInfo(o.price, o.paid_total);
      const payChip = bal ? '<span class="chip' + (bal.due ? ' due' : ' ready') + '">💰 ' + (bal.due ? 'נשאר לשלם ' + ils(bal.left) : bal.text) + '</span>' : '';
      const items = o.lines.map(lineText).filter(Boolean).join(' · ');
      return '<div class="order-card ' + due.cls + '" data-n="' + o.order_number + '">' +
        '<div class="oc-head"><div><b>#' + o.order_number + ' · ' + esc(fullName(o)) + '</b> <span class="sub">' + esc(o.phone) + '</span></div>' + due.html + '</div>' +
        '<div class="sub">' + esc(items) + '</div>' +
        '<div class="chips">' + (allReady ? '<span class="badge-ready">✓ הכל מוכן לאיסוף</span>' : '') + chips +
        (o.supplied_at ? '<span class="chip final">סופקה ' + fmtDay(o.supplied_at) + '</span>' : '') + checkChip(o) + payChip + '</div>' +
        '</div>';
    }).join('') || '<div class="sub" style="text-align:center;padding:20px;">אין הזמנות</div>';
    list.querySelectorAll('.order-card').forEach(c => c.addEventListener('click', () => openDetail(c.dataset.n)));
  } catch (err) { count.textContent = 'שגיאה: ' + err.message; }
}

let audioCtx = null;
function beep(freq, dur, delay, type, vol){
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = audioCtx.currentTime + (delay || 0);
    o.type = type || 'sine'; o.frequency.value = freq; o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(vol || 0.2, t); g.gain.setValueAtTime(0, t + dur); o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
const beepOk = () => beep(880, 0.15);
const beepError = () => { for (let i = 0; i < 6; i++) beep(i % 2 ? 440 : 620, 0.2, i * 0.2, 'square', 0.35); };

}
function addLog(kind, title, detail){
  const el = document.createElement('div');
  el.className = 'entry ' + kind;
  el.innerHTML = '<b></b><div class="d"></div>';
  el.querySelector('b').textContent = title; el.querySelector('.d').textContent = detail || '';
  document.getElementById('scanLog').prepend(el);
}
const recentScans = new Map();
let scanBusy = false;
// אחרי סריקה: שואלים — רק הפריט או כל ההזמנה, ולאיזה מצב
async function processScan(code){
  code = String(code || '').trim();
  if (!code || scanBusy) return;
  // אותו קוד שוב תוך 3 שניות (מצלמה) — מתעלמים
  if (recentScans.has(code) && Date.now() - recentScans.get(code) < 3000) return;
  recentScans.set(code, Date.now());
  let found, order;
  try {
    found = await api('/lookup/' + encodeURIComponent(code));
    order = await api('/orders/' + found.order_number);
  } catch (err) { addLog('warn', code, err.message); flash('warn', code + ' — ' + err.message); beepError(); return; }
  beepOk();
  scanBusy = true;
  const line = found.item_code ? order.lines.find(l => l.item_code === found.item_code) : null;
  const body = openModal('<b>#' + order.order_number + ' · ' + esc(fullName(order)) + '</b>' +
    (order.target_date ? '<div class="sub">יעד: ' + fmtDate(order.target_date) + '</div>' : '') +
    // אילו פריטים לעדכן: הפריט שנסרק מסומן; אפשר לסמן גם פריטים אחרים מההזמנה (סריקת מספר הזמנה — כולם מסומנים)
    '<div style="display:flex;justify-content:space-between;align-items:center;"><b style="font-size:14px;">אילו פריטים לעדכן?</b>' +
    '<button type="button" class="btn-ghost btn-small" id="mAll">סמן / בטל הכל</button></div><div class="pick-list">' +
    order.lines.map(l => '<label' + (line && l.item_code === line.item_code ? ' style="outline:2px solid var(--scan);"' : '') + '><input type="checkbox" value="' + l.item_code + '"' + (!line || l.item_code === line.item_code ? ' checked' : '') + '>' +
      '<span style="flex:1;">' + l.line_no + '. <b>' + esc(lineText(l) || l.item_code) + '</b>' + (line && l.item_code === line.item_code ? ' (נסרק)' : '') + '</span><span class="sub">' + esc(l.status) + '</span></label>').join('') + '</div>' +
    '<b style="font-size:14px;">לאיזה מצב?</b><div class="status-pick">' + activeStatuses().map(s => '<button type="button" data-id="' + s.id + '">' + esc(s.name) + '</button>').join('') + '</div>' +
    '<div><button type="button" class="btn-ghost" id="mCancel">ביטול</button></div>');
  const done = () => { closeModal(); scanBusy = false; document.getElementById('scanInput').focus(); };
  body.querySelector('#mCancel').onclick = () => { addLog('warn', '#' + order.order_number, 'בוטל — לא עודכן'); done(); };
  body.querySelector('#mAll').onclick = () => {
    const boxes = [...body.querySelectorAll('.pick-list input')];
    const all = boxes.every(x => x.checked); boxes.forEach(x => { x.checked = !all; });
  };
  body.querySelectorAll('.status-pick button').forEach(b => b.onclick = async () => {
    const codes = [...body.querySelectorAll('.pick-list input:checked')].map(x => x.value);
    if (!codes.length) { alert('צריך לסמן לפחות פריט אחד'); return; }
    const whole = codes.length === order.lines.length;
    try {
      const r = await api('/scan', { method: 'POST', body: { code: order.order_number, item_codes: codes, status_id: +b.dataset.id } });
      const who = '#' + r.order_number + ' · ' + fullName(r.customer);
      const what = whole && r.total > 1 ? 'כל ההזמנה (' + r.total + ' פריטים)' : r.items.map(i => i.text || i.item_code).join(', ');
      addLog('ok', who + ' → ' + r.status, what + (r.changed < r.total ? ' · ' + (r.total - r.changed) + ' כבר היו במצב הזה' : ''));
      flash('ok', '✓ ' + who + ' — ' + what + ' → ' + r.status);
      beepOk();
      if (!document.getElementById('listPanel').classList.contains('hidden')) loadList();
      else if (!document.getElementById('dashPanel').classList.contains('hidden')) loadDashboard();
      else if (openOrder && openOrder.order_number === r.order_number) openDetail(r.order_number);
    } catch (err) { addLog('warn', code, err.message); flash('warn', err.message); beepError(); }
    done();
  });
}
document.getElementById('scanInput').addEventListener('keydown', async e => {
  if (e.key !== 'Enter') return;
  const v = e.target.value; e.target.value = '';
  await processScan(v);
  e.target.focus();
});
let qr = null, camOn = false;
async function startCamera(){
  const box = document.getElementById('cameraReader');
  box.classList.remove('hidden');
  qr = new Html5Qrcode('cameraReader', { formatsToSupport: [Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.QR_CODE], verbose: false });
  try {
    await qr.start({ facingMode: 'environment' }, {
      fps: 15,
      qrbox: (w, h) => ({ width: Math.max(80, Math.min(280, Math.floor(w * 0.9))), height: Math.max(60, Math.min(140, Math.floor(h * 0.6))) }),
      videoConstraints: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
      experimentalFeatures: { useBarCodeDetectorIfSupported: true },
    }, txt => processScan(txt), () => {});
    camOn = true; document.getElementById('cameraBtn').textContent = '⏹ עצור מצלמה';
  } catch (err) {
    addLog('warn', 'מצלמה', 'לא הצלחתי לפתוח מצלמה: ' + (err?.message || err)); box.classList.add('hidden');
  }
}
async function stopCamera(){
  if (!camOn || !qr) return;
  try { await qr.stop(); qr.clear(); } catch (e) {}
  camOn = false; document.getElementById('cameraReader').classList.add('hidden');
  document.getElementById('cameraBtn').textContent = '📷 מצלמה';
}
document.getElementById('cameraBtn').addEventListener('click', () => camOn ? stopCamera() : startCamera());
window.addEventListener('pagehide', stopCamera);

(async () => {
  try { await loadMeta(); } catch (e) {}
  document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal' && !scanBusy) closeModal(); });
  // ?scan=1 — פתיחה ישר במצב סריקה מהירה
  if (new URLSearchParams(location.search).get('scan') === '1') document.getElementById('scanToggle').click();
  loadDashboard();
})();
</script>
