<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>כניסה — חנות יודאייקה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800&display=swap">
<style>
  :root{ --bg:#f5f4f0; --surface:#fff; --text:#211f1a; --muted:#6b6558; --border:#e2ddd0; --accent:#1e3a5f; --danger:#b3432f; --danger-soft:#fbeae6; --ok:#2f6b35; --ok-soft:#e9f3ea; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#15171b; --surface:#1d2025; --text:#eae7df; --muted:#9b968a; --border:#33363d; --accent:#7fa8d9; --danger:#e08a73; --danger-soft:#3a211c; --ok:#7fce89; --ok-soft:#17291b; } }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font-family:'Heebo',-apple-system,'Segoe UI',sans-serif;padding:16px;}
  .card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px;}
  h1{font-size:21px;margin:0;text-align:center;}
  .sub{color:var(--muted);font-size:13.5px;text-align:center;margin:0;}
  label{font-size:13px;color:var(--muted);display:block;margin-bottom:5px;}
  input{width:100%;padding:13px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);font-family:inherit;font-size:18px;text-align:center;letter-spacing:1px;}
  input:focus{outline:2px solid var(--accent);outline-offset:1px;}
  button{width:100%;padding:13px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;}
  button:disabled{opacity:.6;cursor:default;}
  button.link{background:none;color:var(--accent);font-size:13.5px;padding:4px;font-weight:600;}
  .msg{border-radius:10px;padding:10px 12px;font-size:14px;display:none;text-align:center;}
  .msg.err{display:block;background:var(--danger-soft);color:var(--danger);}
  .msg.ok{display:block;background:var(--ok-soft);color:var(--ok);}
  .hidden{display:none !important;}
</style>
</head>
<body>
<div class="card">
  <h1>🔒 כניסה למערכת</h1>
  <p class="sub" id="intro">חנות יודאייקה — הכניסה בקוד שנשלח ב-SMS</p>
  <form id="stepPhone" autocomplete="off">
    <label for="phone">מספר טלפון</label>
    <input id="phone" type="tel" inputmode="numeric" autocomplete="off" name="login-phone-nofill" placeholder="05X-XXXXXXX" required>
    <div style="height:12px"></div>
    <button type="submit" id="sendBtn">שלח לי קוד</button>
  </form>
  <form id="stepCode" class="hidden">
    <label for="code">הקוד שקיבלת ב-SMS</label>
    <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" required>
    <div style="height:12px"></div>
    <button type="submit" id="verifyBtn">כניסה</button>
    <button type="button" class="link" id="backBtn">← מספר אחר / שלח קוד שוב</button>
  </form>
  <div class="msg" id="msg"></div>
</div>
<script>
const params = new URLSearchParams(location.search);
const msg = document.getElementById('msg');
function show(kind, text){ msg.className = 'msg ' + kind; msg.textContent = text; }
if (params.get('denied')) show('err', 'למשתמש הזה אין הרשאה לאף אתר. פנה למנהל.');
async function post(path, body){
  const res = await fetch('/api/auth/' + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'שגיאה');
  return data;
}
let phone = '';
document.getElementById('stepPhone').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('sendBtn');
  phone = document.getElementById('phone').value;
  btn.disabled = true; btn.textContent = 'שולח…';
  try {
    const r = await post('request-code', { phone });
    show('ok', r.message);
    document.getElementById('stepPhone').classList.add('hidden');
    document.getElementById('stepCode').classList.remove('hidden');
    document.getElementById('code').focus();
  } catch (err) { show('err', err.message); }
  btn.disabled = false; btn.textContent = 'שלח לי קוד';
});
document.getElementById('stepCode').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('verifyBtn');
  btn.disabled = true;
  try {
    const r = await post('verify', { phone, code: document.getElementById('code').value, next: params.get('next') || '' });
    show('ok', '✓ מחובר — מעביר…');
    location.replace(r.redirect);
  } catch (err) { show('err', err.message); btn.disabled = false; document.getElementById('code').select(); }
});
// 6 ספרות — שולחים אוטומטית
document.getElementById('code').addEventListener('input', e => {
  e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
  if (e.target.value.length === 6) document.getElementById('stepCode').requestSubmit();
});
document.getElementById('backBtn').addEventListener('click', () => {
  document.getElementById('stepCode').classList.add('hidden');
  document.getElementById('stepPhone').classList.remove('hidden');
  document.getElementById('code').value = '';
  msg.className = 'msg';
});
</script>
</body>
</html>
