<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>יודאיקה פלוס — איסוף והחזרה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#f5f4f0; --surface:#ffffff; --surface-2:#f0eee7;
    --text:#211f1a; --text-muted:#6b6558; --border:#e2ddd0;
    --accent:#1e3a5f; --accent-2:#163049; --accent-soft:#e8edf3;
    --danger:#b3432f; --danger-soft:#fbeae6; --ok:#2f6b35; --ok-soft:#e9f3ea;
    --warn:#8a5a1f; --warn-soft:#fbf0e3;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15171b; --surface:#1d2025; --surface-2:#242830;
      --text:#eae7df; --text-muted:#9b968a; --border:#33363d;
      --accent:#7fa8d9; --accent-2:#9cc0ee; --accent-soft:#1f2c3b;
      --danger:#e08a73; --danger-soft:#3a211c; --ok:#7fce89; --ok-soft:#17291b;
      --warn:#e3ab5c; --warn-soft:#2e2412;
    }
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Heebo',-apple-system,'Segoe UI',sans-serif;padding:20px 16px 60px;}
  .wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px;}
  h1{font-size:22px;margin:0;}
  .tabs{display:flex;gap:8px;}
  .tab{flex:1;text-align:center;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;}
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;}
  .scan-input{width:100%;padding:16px;font-size:20px;border:2px solid var(--accent);border-radius:12px;text-align:center;font-family:ui-monospace,monospace;background:var(--surface);color:var(--text);}
  .summary{display:flex;gap:10px;}
  .stat{flex:1;text-align:center;background:var(--surface-2);border-radius:10px;padding:10px;}
  .stat b{display:block;font-size:20px;}
  .stat span{font-size:11px;color:var(--text-muted);}
  .log{display:flex;flex-direction:column-reverse;gap:8px;max-height:50vh;overflow-y:auto;}
  .entry{border-radius:11px;padding:10px 13px;font-size:13.5px;border:1px solid;}
  .entry.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok);}
  .entry.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn);}
  .entry.err{background:var(--danger-soft);color:var(--danger);border-color:var(--danger);}
  .entry b{display:block;font-size:14.5px;}
  .entry .d{opacity:.85;font-size:12.5px;margin-top:2px;}
  button.reload{background:var(--accent-soft);color:var(--accent);border:none;border-radius:9px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:13px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:right;padding:7px 6px;border-bottom:1px solid var(--border);}
  th{color:var(--text-muted);font-weight:600;font-size:12px;}
  .hidden{display:none !important;}
  .mode-tabs{display:flex;gap:6px;}
  .mode-tab{flex:1;text-align:center;padding:7px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);cursor:pointer;font-size:12.5px;font-weight:600;color:var(--text-muted);}
  .mode-tab.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);}
  #cameraWrap{position:relative;border-radius:12px;overflow:hidden;background:#000;}
  .zoom-row{direction:ltr;display:flex;align-items:center;justify-content:center;gap:14px;}
  .zoom-row button{width:52px;height:44px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:24px;font-weight:700;cursor:pointer;}
  .zoom-row .zoom-level{min-width:70px;text-align:center;font-weight:600;font-size:14px;}
  #cameraReader{width:100%;}
  .camera-hint{font-size:12px;color:var(--text-muted);text-align:center;}
  button.camera-toggle{width:100%;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px;font-weight:600;font-size:14px;cursor:pointer;}
  button.camera-toggle.stop{background:var(--danger);}
  input.search,select.search{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);font-family:inherit;font-size:14px;}
  .check-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);}
  .check-row .who{font-size:13.5px;font-weight:600;}
  .check-row .sub{font-size:11.5px;color:var(--text-muted);margin-top:2px;}
  button.btn-primary{background:var(--accent);color:#fff;border:none;border-radius:9px;padding:11px 16px;font-weight:600;font-size:14px;cursor:pointer;width:100%;}
  .purpose-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;background:var(--accent);color:#fff;border-radius:9px;padding:10px 14px;font-size:14px;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.2);}
  .purpose-bar button{padding:6px 12px;font-size:12.5px;border:none;border-radius:7px;background:#fff;color:var(--accent);font-weight:700;cursor:pointer;}
  .filters2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>חב"ד יודאייקה — איסוף והחזרה</h1>

  <div class="tabs">
    <div class="tab active" data-tab="scan">סריקה</div>
    <div class="tab" data-tab="pending">ממתין לאיסוף</div>
    <div class="tab" data-tab="mine">מה אצלי</div>
  </div>

  <div id="scanPanel" class="card">
    <div class="mode-tabs">
      <div class="mode-tab active" data-mode="device">⌨️ סורק מחובר</div>
      <div class="mode-tab" data-mode="camera">📷 מצלמה</div>
    </div>

    <div id="deviceMode">
      <input id="scanInput" class="scan-input" placeholder="סרוק ברקוד…" autofocus>
    </div>

    <div id="cameraMode" class="hidden" style="display:flex;flex-direction:column;gap:10px;">
      <div id="cameraWrap" class="hidden"><div id="cameraReader"></div></div>
      <button type="button" class="camera-toggle" id="cameraToggle">הפעל מצלמה</button>
      <button type="button" class="camera-toggle hidden" id="cameraTorch" style="background:var(--surface-2);color:var(--text);">🔦 הדלק פנס</button>
          <div class="zoom-row hidden" id="cameraZoom"><button type="button" class="zoom-out" aria-label="הרחק">−</button><span class="zoom-level"></span><button type="button" class="zoom-in" aria-label="קרב">+</button></div>
      <button type="button" class="camera-toggle hidden" id="cameraSwitch" style="background:var(--surface-2);color:var(--text);">🔄 החלף מצלמה</button>
      <div class="camera-hint">סריקה רציפה — תעבירו פריט אחרי פריט מול המצלמה, בלי לצלם/לאשר כל אחד בנפרד</div>
    </div>

    <div class="summary">
      <div class="stat"><b id="sCount">0</b><span>נסרקו</span></div>
      <div class="stat"><b id="sOk">0</b><span>תקינים</span></div>
      <div class="stat"><b id="sWarn">0</b><span>דורש בירור</span></div>
    </div>
    <div class="log" id="log"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <div id="pendingPanel" class="card hidden">
    <input class="search" id="pendingSearch" placeholder="חיפוש לפי שם / טלפון / כתובת…">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <span style="font-size:13px;color:var(--text-muted);" id="pendingCount"></span>
      <button class="reload" id="pendingReload">רענן</button>
    </div>
    <button type="button" class="btn-primary" id="pendingQuickToggle">⚡ איסוף מהיר</button>
    <div id="pendingQuickMount"></div>
    <div id="pendingBody" style="display:flex;flex-direction:column;gap:8px;"></div>
  </div>

  <div id="minePanel" class="card hidden">
    <input class="search" id="mineSearch" placeholder="חיפוש לפי שם / טלפון / כתובת…">
    <div class="filters2">
      <select class="search" id="mineStage">
        <option value="">כל המצבים</option>
        <option value="collected">אספתי</option>
        <option value="imported">נכנס לתוכנה</option>
        <option value="returning">במסירה לחנות</option>
      </select>
      <input class="search" id="mineCollection" type="number" placeholder="מספר איסוף">
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <span style="font-size:13px;color:var(--text-muted);" id="mineCount"></span>
      <button class="reload" id="mineReload">רענן</button>
    </div>
    <button type="button" class="btn-primary" id="mineQuickToggle">⚡ מסירה לחנות</button>
    <div id="mineQuickMount"></div>
    <div id="mineBody" style="display:flex;flex-direction:column;gap:8px;"></div>
  </div>

  <div id="quickActionPanel" class="card hidden" style="display:flex;flex-direction:column;gap:12px;">
    <div class="purpose-bar">
      <span id="quickActionLabel"></span>
      <div style="display:flex;gap:6px;">
        <button type="button" id="quickScanToggle">📷 סריקה מהירה</button>
        <button type="button" id="quickActionCancel">בטל</button>
      </div>
    </div>
    <div id="quickScanSub" class="hidden" style="display:flex;flex-direction:column;gap:12px;">
      <div class="mode-tabs">
        <div class="mode-tab active" data-mode="device">⌨️ סורק מחובר</div>
        <div class="mode-tab" data-mode="camera">📷 מצלמה</div>
      </div>
      <div id="quickDeviceMode">
        <input id="quickScanInput" class="scan-input" placeholder="סרוק ברקוד…">
      </div>
      <div id="quickCameraMode" class="hidden" style="display:flex;flex-direction:column;gap:10px;">
        <div id="quickCameraWrap" class="hidden"><div id="quickCameraReader"></div></div>
        <button type="button" class="camera-toggle" id="quickCameraToggle">הפעל מצלמה</button>
        <button type="button" class="camera-toggle hidden" id="quickCameraTorch" style="background:var(--surface-2);color:var(--text);">🔦 הדלק פנס</button>
          <div class="zoom-row hidden" id="quickCameraZoom"><button type="button" class="zoom-out" aria-label="הרחק">−</button><span class="zoom-level"></span><button type="button" class="zoom-in" aria-label="קרב">+</button></div>
        <button type="button" class="camera-toggle hidden" id="quickCameraSwitch" style="background:var(--surface-2);color:var(--text);">🔄 החלף מצלמה</button>
        <div class="camera-hint">סריקה רציפה — תעבירו שקית אחרי שקית מול המצלמה</div>
      </div>
    </div>
    <div class="log" id="actionLog"></div>
  </div>
</div>

<script>
const ITEM_LABELS = {
  tefillin_pair:'תפילין זוג', tefillin_head:'תפילין ראש', tefillin_hand:'תפילין יד',
  mezuzah:'מזוזה', megillah:'מגילה', sefer_torah:'ספר תורה', nach:'נ"ך', other:'אחר',
};

// --- tabs ---
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  const wasActive = t.classList.contains('active');
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  const tab = t.dataset.tab;
  document.getElementById('scanPanel').classList.toggle('hidden', tab !== 'scan');
  document.getElementById('pendingPanel').classList.toggle('hidden', tab !== 'pending');
  document.getElementById('minePanel').classList.toggle('hidden', tab !== 'mine');
  if (!wasActive) closeQuickAction();
  if (tab === 'scan') { document.getElementById('scanInput').focus(); return; }
  stopCamera();
  if (tab === 'pending') loadPending(); else loadMine();
}));
window.addEventListener('pagehide', () => { stopCamera(); stopQuickCamera(); });

// --- beep ---
function beep(freq, dur){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = freq;
    osc.connect(gain); gain.connect(ctx.destination);
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    osc.start();
    osc.stop(ctx.currentTime + dur);
  }catch(e){}
}

// --- scan ---
let counts = { total:0, ok:0, warn:0 };
function updateSummary(){
  document.getElementById('sCount').textContent = counts.total;
  document.getElementById('sOk').textContent = counts.ok;
  document.getElementById('sWarn').textContent = counts.warn;
}
function addLog(kind, title, detail){
  const el = document.createElement('div');
  el.className = 'entry ' + kind;
  el.innerHTML = '<b></b><div class="d"></div>';
  el.querySelector('b').textContent = title;
  el.querySelector('.d').textContent = detail;
  document.getElementById('log').appendChild(el);
}

// מטפל בקוד שהתקבל, בין אם הוקלד/נסרק ע"י סורק מחובר ובין אם זוהה ע"י המצלמה
async function processScan(code){
  code = (code || '').trim();
  if (!code) return;

  counts.total++;
  try {
    const res = await fetch('/api/supplier/scan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ bag_code: code }),
    });
    const data = await res.json();
    if (!res.ok) {
      counts.warn++;
      addLog('warn', code, data.error || 'שגיאה');
      beep(220, 0.3);
    } else {
      const who = data.bag.customer.first_name + ' ' + data.bag.customer.last_name;
      const item = (ITEM_LABELS[data.bag.item_type] || data.bag.item_type) + (data.bag.quantity > 1 ? ' ×' + data.bag.quantity : '');
      if (data.action === 'picked_up') {
        counts.ok++; addLog('ok', who + ' — נאסף', item + ' · הזמנה #' + data.bag.order_number); beep(880, 0.15);
      } else if (data.action === 'returned') {
        counts.ok++; addLog('ok', who + ' — הוחזר', item + ' · הזמנה #' + data.bag.order_number); beep(880, 0.15); beep(660, 0.15);
      } else {
        counts.warn++; addLog('warn', who + ' — סריקה כפולה', 'אותה שקית נסרקה הרגע, לא נרשם שוב');
      }
    }
  } catch (err) {
    counts.warn++;
    addLog('err', code, 'שגיאת רשת: ' + err.message);
  }
  updateSummary();
}

// --- מצב סורק מחובר (keyboard-wedge) ---
const scanInput = document.getElementById('scanInput');
scanInput.addEventListener('keydown', async (e) => {
  if (e.key !== 'Enter') return;
  const code = scanInput.value.trim();
  scanInput.value = '';
  await processScan(code);
  scanInput.focus();
});
document.body.addEventListener('click', () => {
  const deviceVisible = !document.getElementById('scanPanel').classList.contains('hidden') &&
                         !document.getElementById('deviceMode').classList.contains('hidden');
  if (deviceVisible) scanInput.focus();
});

// --- מצב מצלמה — סריקה רציפה, בלי לצלם/לאשר כל קוד בנפרד ---
document.querySelectorAll('.mode-tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.mode-tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  const isDevice = t.dataset.mode === 'device';
  document.getElementById('deviceMode').classList.toggle('hidden', !isDevice);
  document.getElementById('cameraMode').classList.toggle('hidden', isDevice);
  if (isDevice) { stopCamera(); scanInput.focus(); }
}));

let html5Qr = null;
let cameraRunning = false;
const recentlySeen = new Map(); // code -> timestamp, מונע עיבוד כפול של אותו קוד בזמן שהוא עדיין מול המצלמה
const CAMERA_DEBOUNCE_MS = 3000;

// מונה את המצלמות הזמינות (פעם אחת, מבקש הרשאה אם צריך) ובוחר כברירת מחדל את האחורית —
// לפי label אם יש ("back"/"rear"/"environment"), אחרת מצלמה אחרונה ברשימה (נפוץ שזו האחורית).
// facingMode:'environment' לבדו לא תמיד אמין (נצפה שפתח מצלמה קדמית במכשיר אמיתי). משותף
// לשני מופעי המצלמה בדף הזה — אותו מכשיר פיזי, אין טעם לבקש הרשאה/לספור פעמיים.
let cameraDevices = [];
let currentCameraIndex = 0;
async function getCameraDevices(){
  if (!cameraDevices.length) {
    try { cameraDevices = await Html5Qrcode.getCameras(); } catch (e) { cameraDevices = []; }
    if (cameraDevices.length) {
      const backIdx = cameraDevices.findIndex(c => /back|rear|environment|אחורי/i.test(c.label || ''));
      currentCameraIndex = backIdx >= 0 ? backIdx : cameraDevices.length - 1;
    }
  }
  return cameraDevices;
}

// חשוב: ב-html5-qrcode, כש-config.videoConstraints מוגדר הוא *מחליף לגמרי* את הארגומנט הראשון של start()
// (בחירת המצלמה) — כך שאם שמים בו רק רזולוציה, הדפדפן בוחר מצלמת ברירת מחדל (בד"כ הקדמית) וכפתור
// "החלף מצלמה" לא משפיע. לכן בחירת המצלמה (deviceId / facingMode) חייבת להיות גם בתוך videoConstraints.
function cameraVideoConstraints(cameras){
  const select = cameras.length
    ? { deviceId: { exact: cameras[currentCameraIndex].id } }
    : { facingMode: { ideal: 'environment' } };
  return { ...select, width: { ideal: 1920 }, height: { ideal: 1080 } };
}

async function onCameraDecode(decodedText){
  const now = Date.now();
  const last = recentlySeen.get(decodedText);
  if (last && now - last < CAMERA_DEBOUNCE_MS) return; // אותו קוד עדיין בשדה הראייה — מתעלמים
  recentlySeen.set(decodedText, now);
  await processScan(decodedText);
}

// בודק אם המצלמה הפעילה תומכת בפנס, ומציג/מסתיר את כפתור הפנס בהתאם. משותף לשני מצבי המצלמה בדף הזה.
let torchOn = false;
function setupTorchButton(instance, btnId){
  const btn = document.getElementById(btnId);
  torchOn = false;
  btn.textContent = '🔦 הדלק פנס';
  try {
    const caps = instance.getRunningTrackCapabilities && instance.getRunningTrackCapabilities();
    btn.classList.toggle('hidden', !(caps && caps.torch));
  } catch (e) {
    btn.classList.add('hidden');
  }
}
// זום אמיתי של המצלמה (לא הגדלת תצוגה ב-CSS — המפענח קורא את הפריים הגולמי מהמצלמה, אז רק זום של
// המצלמה עצמה עוזר לסרוק ברקוד קטן בלי להצמיד את הטלפון). מוצג רק אם המכשיר תומך (בד"כ Chrome באנדרואיד).
function setupZoomControls(instance, rowId){
  const row = document.getElementById(rowId);
  let caps = null;
  try { caps = instance.getRunningTrackCapabilities && instance.getRunningTrackCapabilities(); } catch (e) {}
  const z = caps && caps.zoom;
  if (!z || !(z.max > z.min)) { row.classList.add('hidden'); return; }
  let level = z.min;
  try { level = instance.getRunningTrackSettings().zoom || z.min; } catch (e) {}
  const step = Math.max(z.step || 0.1, (z.max - z.min) / 8);
  const label = row.querySelector('.zoom-level');
  const show = () => { label.textContent = 'זום ×' + (Math.round(level * 10) / 10); };
  const apply = async (delta) => {
    const next = Math.min(z.max, Math.max(z.min, level + delta));
    if (next === level) return;
    try { await instance.applyVideoConstraints({ advanced: [{ zoom: next }] }); level = next; show(); } catch (e) {}
  };
  row.querySelector('.zoom-in').onclick = () => apply(step);
  row.querySelector('.zoom-out').onclick = () => apply(-step);
  show();
  row.classList.remove('hidden');
}

async function toggleTorch(instance, btnId, logFn){
  const btn = document.getElementById(btnId);
  try {
    torchOn = !torchOn;
    await instance.applyVideoConstraints({ advanced: [{ torch: torchOn }] });
    btn.textContent = torchOn ? '🔦 כבה פנס' : '🔦 הדלק פנס';
  } catch (e) {
    (logFn || addLog)('warn', 'פנס', 'לא ניתן להפעיל פנס במכשיר הזה');
  }
}

async function startCamera(){
  const wrap = document.getElementById('cameraWrap');
  const btn = document.getElementById('cameraToggle');
  wrap.classList.remove('hidden');
  btn.textContent = 'עוצר…';
  html5Qr = new Html5Qrcode('cameraReader', {
    formatsToSupport: [
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.QR_CODE,
    ],
    verbose: false,
  });
  const cameras = await getCameraDevices();
  const cameraIdOrConfig = cameras.length ? cameras[currentCameraIndex].id : { facingMode: 'environment' };
  try {
    await html5Qr.start(
      cameraIdOrConfig,
      {
        fps: 15,
        qrbox: { width: 280, height: 140 },
        videoConstraints: cameraVideoConstraints(cameras),
        experimentalFeatures: { useBarCodeDetectorIfSupported: true },
      },
      onCameraDecode,
      () => {} // שגיאת פענוח פריים בודד — מתעלמים, זה קורה כל הזמן בין סריקות תקינות
    );
    cameraRunning = true;
    btn.textContent = 'עצור מצלמה';
    btn.classList.add('stop');
    setupTorchButton(html5Qr, 'cameraTorch');
    setupZoomControls(html5Qr, 'cameraZoom');
    document.getElementById('cameraSwitch').classList.toggle('hidden', cameras.length < 2);
  } catch (err) {
    addLog('err', 'מצלמה', 'לא הצלחתי לפתוח מצלמה: ' + (err?.message || err?.name || String(err)));
    wrap.classList.add('hidden');
    btn.textContent = 'הפעל מצלמה';
  }
}

async function stopCamera(){
  if (!cameraRunning || !html5Qr) return;
  try { await html5Qr.stop(); html5Qr.clear(); } catch (e) {}
  cameraRunning = false;
  document.getElementById('cameraWrap').classList.add('hidden');
  document.getElementById('cameraToggle').textContent = 'הפעל מצלמה';
  document.getElementById('cameraToggle').classList.remove('stop');
  document.getElementById('cameraTorch').classList.add('hidden');
  document.getElementById('cameraZoom').classList.add('hidden');
  document.getElementById('cameraSwitch').classList.add('hidden');
}

async function switchCamera(){
  if (!cameraRunning || cameraDevices.length < 2) return;
  currentCameraIndex = (currentCameraIndex + 1) % cameraDevices.length;
  await stopCamera();
  await startCamera();
}

document.getElementById('cameraToggle').addEventListener('click', () => {
  if (cameraRunning) stopCamera(); else startCamera();
});
document.getElementById('cameraTorch').addEventListener('click', () => {
  if (cameraRunning) toggleTorch(html5Qr, 'cameraTorch');
});
document.getElementById('cameraSwitch').addEventListener('click', switchCamera);

// --- רשימות (ממתין לאיסוף / מה אצלי) + חיפוש חכם לפי שם/טלפון/כתובת ---
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function matchesSearch(b, q){
  if (!q) return true;
  const hay = (b.customer.first_name + ' ' + b.customer.last_name + ' ' + b.customer.phone + ' ' +
    (b.customer.address || '') + ' ' + b.bag_code + ' ' + b.order_number).toLowerCase();
  return hay.includes(q);
}
const STAGE_LABELS = { collected: 'אספתי', imported: 'נכנס לתוכנה', returning: 'במסירה לחנות' };
function renderRows(bags, extraLine, clickable){
  return bags.map(b => {
    const who = esc(b.customer.first_name) + ' ' + esc(b.customer.last_name);
    const item = (ITEM_LABELS[b.item_type] || b.item_type) + (b.quantity > 1 ? ' ×' + b.quantity : '');
    const noteInfo = b.item_type_note ? ' · 📝 ' + esc(b.item_type_note) : '';
    return '<div class="check-row"' + (clickable ? ' data-code="' + b.bag_code + '" style="cursor:pointer;"' : '') + '>' +
      '<div><div class="who">' + b.bag_code + ' · ' + who + '</div>' +
      '<div class="sub">' + esc(b.customer.phone) + ' · הזמנה #' + b.order_number + ' · ' + item + noteInfo + (extraLine ? extraLine(b) : '') + '</div></div></div>';
  }).join('') || '<div style="color:var(--text-muted);text-align:center;padding:16px;">אין שקיות מתאימות</div>';
}
function wireRowClicks(containerId){
  document.querySelectorAll('#' + containerId + ' .check-row[data-code]').forEach(row => {
    row.addEventListener('click', () => applyQuickAction([row.dataset.code]));
  });
}

let pendingBags = [];
async function loadPending(){
  const countEl = document.getElementById('pendingCount');
  countEl.textContent = 'טוען…';
  try {
    const res = await fetch('/api/supplier/pending');
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    pendingBags = data.bags;
    renderPending();
  } catch (err) {
    countEl.textContent = 'שגיאה: ' + err.message;
  }
}
function renderPending(){
  const q = document.getElementById('pendingSearch').value.trim().toLowerCase();
  const filtered = pendingBags.filter(b => matchesSearch(b, q));
  document.getElementById('pendingCount').textContent = filtered.length + ' שקיות ממתינות';
  const active = quickAction && quickAction.mount === 'pending';
  document.getElementById('pendingBody').innerHTML = renderRows(filtered, null, active);
  if (active) wireRowClicks('pendingBody');
}
document.getElementById('pendingReload').onclick = loadPending;
document.getElementById('pendingSearch').addEventListener('input', renderPending);

let mineBags = [];
async function loadMine(){
  const countEl = document.getElementById('mineCount');
  countEl.textContent = 'טוען…';
  try {
    const res = await fetch('/api/supplier/with-me');
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    mineBags = data.bags;
    renderMine();
  } catch (err) {
    countEl.textContent = 'שגיאה: ' + err.message;
  }
}
function renderMine(){
  const q = document.getElementById('mineSearch').value.trim().toLowerCase();
  const stage = document.getElementById('mineStage').value;
  const collection = document.getElementById('mineCollection').value;
  const active = quickAction && quickAction.mount === 'mine';
  const filtered = mineBags.filter(b => matchesSearch(b, q))
    .filter(b => !stage || b.stage === stage)
    .filter(b => !collection || String(b.collection_number) === String(collection))
    // במצב "מסירה לחנות" מציגים רק שקיות שעדיין אפשר למסור (לא כאלה שכבר הוחזרו)
    .filter(b => !active || b.stage !== 'returning');
  document.getElementById('mineCount').textContent = filtered.length + ' שקיות אצלי כרגע';
  document.getElementById('mineBody').innerHTML = renderRows(filtered, (b) =>
    ' · ' + (STAGE_LABELS[b.stage] || b.stage) +
    (b.picked_up_at ? ' · אצלי מאז ' + new Date(b.picked_up_at).toLocaleDateString('he-IL') : ''), active);
  if (active) wireRowClicks('mineBody');
}
document.getElementById('mineReload').onclick = loadMine;
document.getElementById('mineSearch').addEventListener('input', renderMine);
document.getElementById('mineStage').addEventListener('change', renderMine);
document.getElementById('mineCollection').addEventListener('input', () => {
  clearTimeout(window._mineCollectionDebounce);
  window._mineCollectionDebounce = setTimeout(renderMine, 300);
});

// --- "פעולה מהירה" משותפת לשני המסכים: לחיצה על שורה מבצעת מיד, + אפשרות סריקה מהירה ---
let quickAction = null; // {type:'pickup'|'return', mount:'pending'|'mine'}
let quickCameraInstance = null;
let quickCameraRunning = false;
const quickRecentlySeen = new Map();

function openQuickAction(mount, type, label){
  quickAction = { type, mount };
  const panel = document.getElementById('quickActionPanel');
  document.getElementById(mount === 'pending' ? 'pendingQuickMount' : 'mineQuickMount').appendChild(panel);
  document.getElementById('quickActionLabel').textContent = label;
  panel.classList.remove('hidden');
  document.getElementById('quickScanSub').classList.add('hidden');
  document.getElementById('actionLog').innerHTML = '';
  if (mount === 'pending') renderPending(); else renderMine();
}
function closeQuickAction(){
  stopQuickCamera();
  const mount = quickAction && quickAction.mount;
  quickAction = null;
  document.getElementById('quickActionPanel').classList.add('hidden');
  if (mount === 'pending') renderPending(); else if (mount === 'mine') renderMine();
}
document.getElementById('pendingQuickToggle').addEventListener('click', () => {
  if (quickAction && quickAction.mount === 'pending') { closeQuickAction(); return; }
  openQuickAction('pending', 'pickup', '📦 מצב פעיל: איסוף מהיר — לחיצה על שורה תסמן אותה כנאספה');
});
document.getElementById('mineQuickToggle').addEventListener('click', () => {
  if (quickAction && quickAction.mount === 'mine') { closeQuickAction(); return; }
  openQuickAction('mine', 'return', '🏬 מצב פעיל: מסירה לחנות — לחיצה על שורה תסמן אותה כהוחזרה');
});
document.getElementById('quickActionCancel').addEventListener('click', closeQuickAction);
document.getElementById('quickScanToggle').addEventListener('click', () => {
  const sub = document.getElementById('quickScanSub');
  sub.classList.toggle('hidden');
  if (!sub.classList.contains('hidden')) document.getElementById('quickScanInput').focus();
  else stopQuickCamera();
});

function addQuickLog(kind, title, detail){
  const el = document.createElement('div');
  el.className = 'entry ' + kind;
  el.innerHTML = '<b></b><div class="d"></div>';
  el.querySelector('b').textContent = title;
  el.querySelector('.d').textContent = detail;
  document.getElementById('actionLog').appendChild(el);
}

async function applyQuickAction(bag_codes){
  if (!quickAction) return;
  try {
    const res = await fetch('/api/supplier/bulk-scan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ bag_codes, action: quickAction.type }),
    });
    const data = await res.json();
    if (!res.ok) {
      bag_codes.forEach(c => addQuickLog('warn', c, data.error || 'שגיאה'));
      beep(220, 0.3);
    } else {
      (data.results || []).forEach(r => {
        if (!r.ok) { addQuickLog('warn', r.bag_code, r.error || 'שגיאה'); return; }
        const who = r.bag.customer.first_name + ' ' + r.bag.customer.last_name;
        addQuickLog('ok', who, r.bag.bag_code + ' · הזמנה #' + r.bag.order_number);
      });
      beep(880, 0.15);
    }
  } catch (err) {
    bag_codes.forEach(c => addQuickLog('err', c, 'שגיאת רשת: ' + err.message));
  }
  if (quickAction.mount === 'pending') loadPending(); else loadMine();
}

async function quickProcessScan(code){
  code = (code || '').trim();
  if (!code) return;
  await applyQuickAction([code]);
}
document.getElementById('quickScanInput').addEventListener('keydown', async (e) => {
  if (e.key !== 'Enter') return;
  const code = e.target.value.trim();
  e.target.value = '';
  await quickProcessScan(code);
  e.target.focus();
});
document.querySelectorAll('#quickScanSub .mode-tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('#quickScanSub .mode-tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  const isDevice = t.dataset.mode === 'device';
  document.getElementById('quickDeviceMode').classList.toggle('hidden', !isDevice);
  document.getElementById('quickCameraMode').classList.toggle('hidden', isDevice);
  if (isDevice) { stopQuickCamera(); document.getElementById('quickScanInput').focus(); }
}));

async function onQuickCameraDecode(decodedText){
  const now = Date.now();
  const last = quickRecentlySeen.get(decodedText);
  if (last && now - last < 3000) return;
  quickRecentlySeen.set(decodedText, now);
  await quickProcessScan(decodedText);
}
async function startQuickCamera(){
  const wrap = document.getElementById('quickCameraWrap');
  const btn = document.getElementById('quickCameraToggle');
  wrap.classList.remove('hidden');
  btn.textContent = 'עוצר…';
  quickCameraInstance = new Html5Qrcode('quickCameraReader', {
    formatsToSupport: [Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.QR_CODE],
    verbose: false,
  });
  const cameras = await getCameraDevices();
  const cameraIdOrConfig = cameras.length ? cameras[currentCameraIndex].id : { facingMode: 'environment' };
  try {
    await quickCameraInstance.start(
      cameraIdOrConfig,
      {
        fps: 15,
        qrbox: { width: 280, height: 140 },
        videoConstraints: cameraVideoConstraints(cameras),
        experimentalFeatures: { useBarCodeDetectorIfSupported: true },
      },
      onQuickCameraDecode,
      () => {}
    );
    quickCameraRunning = true;
    btn.textContent = 'עצור מצלמה';
    btn.classList.add('stop');
    setupTorchButton(quickCameraInstance, 'quickCameraTorch');
    setupZoomControls(quickCameraInstance, 'quickCameraZoom');
    document.getElementById('quickCameraSwitch').classList.toggle('hidden', cameras.length < 2);
  } catch (err) {
    addQuickLog('err', 'מצלמה', 'לא הצלחתי לפתוח מצלמה: ' + (err?.message || err?.name || String(err)));
    wrap.classList.add('hidden');
    btn.textContent = 'הפעל מצלמה';
  }
}
async function stopQuickCamera(){
  if (!quickCameraRunning || !quickCameraInstance) return;
  try { await quickCameraInstance.stop(); quickCameraInstance.clear(); } catch (e) {}
  quickCameraRunning = false;
  document.getElementById('quickCameraWrap').classList.add('hidden');
  document.getElementById('quickCameraToggle').textContent = 'הפעל מצלמה';
  document.getElementById('quickCameraToggle').classList.remove('stop');
  document.getElementById('quickCameraTorch').classList.add('hidden');
  document.getElementById('quickCameraZoom').classList.add('hidden');
  document.getElementById('quickCameraSwitch').classList.add('hidden');
}
async function switchQuickCamera(){
  if (!quickCameraRunning || cameraDevices.length < 2) return;
  currentCameraIndex = (currentCameraIndex + 1) % cameraDevices.length;
  await stopQuickCamera();
  await startQuickCamera();
}
document.getElementById('quickCameraTorch').addEventListener('click', () => {
  if (quickCameraRunning) toggleTorch(quickCameraInstance, 'quickCameraTorch', addQuickLog);
});
document.getElementById('quickCameraToggle').addEventListener('click', () => {
  if (quickCameraRunning) stopQuickCamera(); else startQuickCamera();
});
document.getElementById('quickCameraSwitch').addEventListener('click', switchQuickCamera);
</script>
